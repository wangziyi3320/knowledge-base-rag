<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="支持文档上传、混合检索和引用溯源的本地知识库 RAG 演示" />
    <title>知识库 RAG</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">LOCAL KNOWLEDGE BASE</p>
        <h1>知识库 RAG</h1>
        <p class="intro">上传 TXT、Markdown 或 PDF，使用混合检索定位证据，并生成带引用的回答。</p>
      </header>

      <section class="panel">
        <div class="section-title">
          <div><span>01</span><h2>文档管理</h2></div>
          <label class="upload-button">上传文档<input id="fileInput" type="file" accept=".txt,.md,.pdf" /></label>
        </div>
        <p id="uploadStatus" class="status"></p>
        <div id="documentList" class="document-list"></div>
      </section>

      <section class="panel">
        <div class="section-title"><div><span>02</span><h2>知识问答</h2></div></div>
        <form id="queryForm">
          <textarea id="question" rows="3" placeholder="例如：系统支持哪些文件格式？" required></textarea>
          <div class="form-actions">
            <label>返回片段 <input id="topK" type="number" min="1" max="12" value="5" /></label>
            <button type="submit">检索并回答</button>
          </div>
        </form>
        <p id="queryStatus" class="status"></p>
        <article id="answer" class="answer hidden"></article>
        <h3 id="citationHeading" class="evidence-heading hidden"></h3>
        <div id="citations" class="citations"></div>
      </section>

      <section class="panel">
        <div class="section-title"><div><span>03</span><h2>工单草稿</h2></div></div>
        <p class="intro">问题仍需人工处理时，可将上方提问转为可编辑草稿。核对并确认后才保存工单。</p>
        <button id="draftTicket" type="button">用当前提问生成草稿</button>
        <form id="ticketForm" class="ticket-form hidden">
          <label>标题<input id="ticketTitle" type="text" minlength="2" maxlength="100" required /></label>
          <label>分类
            <select id="ticketCategory">
              <option>账号</option><option>网络</option><option>设备</option><option>财务</option><option>其他</option>
            </select>
          </label>
          <label>问题描述<textarea id="ticketDescription" rows="3" minlength="2" maxlength="2000" required></textarea></label>
          <label class="confirm"><input id="ticketConfirm" type="checkbox" required /> 我已核对草稿，确认提交工单</label>
          <button type="submit">确认并保存</button>
        </form>
        <p id="ticketStatus" class="status"></p>
        <div id="ticketList" class="document-list"></div>
      </section>
    </main>
    <script src="/static/app.js" type="module"></script>
  </body>
</html>
